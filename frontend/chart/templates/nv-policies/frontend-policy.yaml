{{- if .Values.neuvector.enabled }}
apiVersion: neuvector.com/v1
kind: NvSecurityRule
metadata:
  name: nv.frontend.{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
spec:
  dlp:
    settings: []
    status: true
  egress:
  - action: allow
    applications:
    - HTTP
    name: nv.backend.{{ .Release.Namespace }}-egress-0
    ports: any
    priority: 0
    selector:
      comment: ""
      criteria:
      - key: service
        op: =
        value: backend.{{ .Release.Namespace }}
      - key: domain
        op: =
        value: {{ .Release.Namespace }}
      name: nv.backend.{{ .Release.Namespace }}
      original_name: ""
  file: []
  ingress:
  - action: allow
    applications:
    - SSL
    name: nv.frontend.{{ .Release.Namespace }}-ingress-0
    ports: tcp/8080
    priority: 0
    selector:
      comment: ""
      criteria: []
      name: external
      original_name: ""
  - action: allow
    applications:
    - HTTP
    name: nv.frontend.{{ .Release.Namespace }}-ingress-1
    ports: tcp/8080
    priority: 0
    selector:
      comment: ""
      criteria: []
      name: nodes
      original_name: ""
  process:
  - action: allow
    allow_update: false
    name: sh
    path: /bin/sh
  - action: allow
    allow_update: false
    name: bash
    path: /bin/bash
  - action: allow
    allow_update: false
    name: dash
    path: /usr/bin/bash
  process_profile:
    baseline: basic
  target:
    policymode: Protect
    selector:
      comment: ""
      criteria:
      - key: service
        op: =
        value: frontend.{{ .Release.Namespace }}
      - key: domain
        op: =
        value: {{ .Release.Namespace }}
      name: nv.frontend.{{ .Release.Namespace }}
      original_name: ""
  waf:
    settings: []
    status: true
{{- end }}